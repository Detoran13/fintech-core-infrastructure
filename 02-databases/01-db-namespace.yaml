apiVersion: v1
kind: Namespace
metadata:
  name: fintech-databases
  labels:
    tier: database
    project: fintech
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: db-quota
  namespace: fintech-databases
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "3"
    limits.memory: 4Gi
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: db-limit-range
  namespace: fintech-databases
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 512Mi

apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: fintech-kafka
  namespace: fintech-messaging
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 3.7.0
    metadataVersion: 3.7-IV4
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        # Белый список: разрешаем доступ к порту 9092 строго Producer и Consumer из fintech-apps
        networkPolicyPeers:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: fintech-apps
            podSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values: ["fintech-producer", "fintech-consumer"]
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}

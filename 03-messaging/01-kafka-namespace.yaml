apiVersion: v1
kind: Namespace
metadata:
  name: fintech-messaging
  labels:
    tier: messaging
    project: fintech
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kafka-quota
  namespace: fintech-messaging
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 6Gi
    limits.cpu: "6"
    limits.memory: 10Gi
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: kafka-limit-range
  namespace: fintech-messaging
spec:
  limits:
    - type: Container
      default:
        cpu: 1000m
        memory: 2Gi
      defaultRequest:
        cpu: 500m
        memory: 1Gi

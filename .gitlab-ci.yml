# ==============================================================================
# ENTERPRISE CI/CD PIPELINE: FINTECH CORE PLATFORM
# Production Approach: Zero-Trust Security (CI builds & scans, GitOps deploys)
# ==============================================================================

stages:
  - test
  - build
  - security_scan

variables:
  PRODUCER_IMAGE: "$CI_REGISTRY_IMAGE/producer"
  CONSUMER_IMAGE: "$CI_REGISTRY_IMAGE/consumer"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# 1. QUALITY GATE (Модульные тесты и статический анализ)
unit-tests:
  stage: test
  image: python:3.11-slim
  tags:
    - baremetal-ci
    - docker
  before_script:
    - pip install --no-cache-dir flake8 pytest
  script:
    - echo "=== 1. COMPILATION CHECK ==="
    - python -m py_compile src/producer/producer.py src/consumer/consumer.py tests/test_banking_logic.py
    - echo "=== 2. STATIC CODE ANALYSIS (FLAKE8) ==="
    - flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503,F401,E302,E305,W292,W293
    - echo "=== 3. PYTEST BANKING LOGIC SUITE ==="
    - pytest -v tests/test_banking_logic.py

# 2. CONTAINERIZATION & OCI REGISTRY PUSH (Docker-out-of-Docker)
build-and-push:
  stage: build
  image: docker:26.1-cli
  tags:
    - baremetal-ci
    - docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "=== BUILDING & PUSHING PRODUCER ==="
    - docker build -t "${PRODUCER_IMAGE}:${IMAGE_TAG}" -t "${PRODUCER_IMAGE}:latest" src/producer/
    - docker push "${PRODUCER_IMAGE}:${IMAGE_TAG}"
    - docker push "${PRODUCER_IMAGE}:latest"
    - echo "=== BUILDING & PUSHING CONSUMER ==="
    - docker build -t "${CONSUMER_IMAGE}:${IMAGE_TAG}" -t "${CONSUMER_IMAGE}:latest" src/consumer/
    - docker push "${CONSUMER_IMAGE}:${IMAGE_TAG}"
    - docker push "${CONSUMER_IMAGE}:latest"

# 3. DEVSECOPS VULNERABILITY SCANNING (Trivy)
security-scan-trivy:
  stage: security_scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  tags:
    - baremetal-ci
    - docker
  script:
    - echo "=== SCANNING PRODUCER IMAGE ==="
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --format table "${PRODUCER_IMAGE}:${IMAGE_TAG}"
    - echo "=== SCANNING CONSUMER IMAGE ==="
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --format table "${CONSUMER_IMAGE}:${IMAGE_TAG}"

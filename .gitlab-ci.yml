stages:
  - test
  - build
  - security_scan
  - promote_gitops

variables:
  PRODUCER_IMAGE: "$CI_REGISTRY_IMAGE/producer"
  CONSUMER_IMAGE: "$CI_REGISTRY_IMAGE/consumer"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# 1. СТАДИЯ ТЕСТИРОВАНИЯ (QUALITY GATE)
unit-tests:
  stage: test
  image: python:3.11-slim
  tags:
    - baremetal-ci
    - docker
  before_script:
    - pip install --no-cache-dir flake8 pytest
  script:
    - echo "=== 1. COMPILATION CHECK ==="
    - python -m py_compile src/producer/producer.py src/consumer/consumer.py tests/test_banking_logic.py
    - echo "=== 2. STATIC CODE ANALYSIS (FLAKE8) ==="
    - flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503,F401,E302,E305,W292,W293
    - echo "=== 3. PYTEST BANKING LOGIC SUITE ==="
    - pytest -v tests/test_banking_logic.py

# 2. СТАДИЯ СБОРКИ И ПУША ОБРАЗОВ (DOCKER-OUT-OF-DOCKER)
build-and-push:
  stage: build
  image: docker:26.1-cli
  tags:
    - baremetal-ci
    - docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "=== BUILDING & PUSHING PRODUCER ==="
    - docker build -t "${PRODUCER_IMAGE}:${IMAGE_TAG}" -t "${PRODUCER_IMAGE}:latest" src/producer/
    - docker push "${PRODUCER_IMAGE}:${IMAGE_TAG}"
    - docker push "${PRODUCER_IMAGE}:latest"
    - echo "=== BUILDING & PUSHING CONSUMER ==="
    - docker build -t "${CONSUMER_IMAGE}:${IMAGE_TAG}" -t "${CONSUMER_IMAGE}:latest" src/consumer/
    - docker push "${CONSUMER_IMAGE}:${IMAGE_TAG}"
    - docker push "${CONSUMER_IMAGE}:latest"

# 3. СТАДИЯ СКАНЕРА БЕЗОПАСНОСТИ (DEVSECOPS TRIVY)
security-scan-trivy:
  stage: security_scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  tags:
    - baremetal-ci
    - docker
  script:
    - echo "=== SCANNING PRODUCER ==="
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --format table "${PRODUCER_IMAGE}:${IMAGE_TAG}"
    - echo "=== SCANNING CONSUMER ==="
    - trivy image --exit-code 0 --severity HIGH,CRITICAL --format table "${CONSUMER_IMAGE}:${IMAGE_TAG}"

# 4. СТАДИЯ АВТОМАТИЧЕСКОГО ПРОМОУШЕНА В GITOPS (ЧЕРЕЗ ORIGIN)
promote-gitops:
  stage: promote_gitops
  image:
    name: alpine/git:latest
    entrypoint: [""]
  tags:
    - baremetal-ci
    - docker
  script: |
    echo "=== PROMOTING IMAGE TAGS TO GITOPS MANIFESTS ==="
    git config --global user.name "GitLab CI Bot"
    git config --global user.email "ci-bot@fintech.local"
    # Внедрение токена в дефолтный ремоут origin
    git remote set-url origin https://oauth2:${GITLAB_PUSH_TOKEN}@gitlab.com/detoran13/fintech-core-infrastructure.git
    git fetch origin main
    git checkout main
    sed -i 's|image: registry.gitlab.com/detoran13/fintech-core-infrastructure/producer:.*|image: registry.gitlab.com/detoran13/fintech-core-infrastructure/producer:'"${CI_COMMIT_SHORT_SHA}"'|g' 05-apps/03-fintech-producer.yaml
    sed -i 's|image: registry.gitlab.com/detoran13/fintech-core-infrastructure/consumer:.*|image: registry.gitlab.com/detoran13/fintech-core-infrastructure/consumer:'"${CI_COMMIT_SHORT_SHA}"'|g' 05-apps/04-fintech-consumer.yaml
    git add 05-apps/03-fintech-producer.yaml 05-apps/04-fintech-consumer.yaml
    git diff --staged
    git commit -m "ci(deploy): promote image tag ${CI_COMMIT_SHORT_SHA} to production [skip ci]" || echo "No changes to commit"
    git push origin main

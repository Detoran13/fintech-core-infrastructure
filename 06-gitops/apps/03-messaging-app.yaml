apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 03-messaging-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Detoran13/fintech-core-infrastructure.git
    targetRevision: main
    path: 03-messaging
  destination:
    server: https://kubernetes.default.svc
    namespace: fintech-messaging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      